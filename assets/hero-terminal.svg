<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <style>
    .win { fill: #0A0F08; stroke: #22331E; stroke-width: 2; }
    .bar { fill: #060D08; }
    .prompt { fill: #CAFF3C; font-size: 17px; font-weight: bold; }
    .out { fill: #E8F5E1; font-size: 17px; }
    .dim { fill: #7A8B6F; font-size: 15px; }
    .accent { fill: #8AFF57; font-size: 20px; font-weight: bold; }
    .cursor { fill: #CAFF3C; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
    .l1 { animation: fade 12s infinite; }
    .l2 { animation: fade 12s infinite; animation-delay: 1.2s; }
    .l3 { animation: fade 12s infinite; animation-delay: 2.4s; }
    .l4 { animation: fade 12s infinite; animation-delay: 3.6s; }
    .l5 { animation: fade 12s infinite; animation-delay: 4.8s; }
    .l6 { animation: fade 12s infinite; animation-delay: 6.0s; }
    @keyframes fade { 0% { opacity: 0; } 8%,88% { opacity: 1; } 96%,100% { opacity: 0; } }
  </style>
  <rect class="win" x="4" y="4" width="872" height="292" rx="14"/>
  <rect class="bar" x="4" y="4" width="872" height="40" rx="14"/>
  <rect class="bar" x="4" y="30" width="872" height="14"/>
  <circle cx="34" cy="24" r="7" fill="#FF5F57"/>
  <circle cx="58" cy="24" r="7" fill="#FEBC2E"/>
  <circle cx="82" cy="24" r="7" fill="#28C840"/>
  <text x="440" y="30" text-anchor="middle" fill="#7A8B6F" font-size="14">nilesh@github: ~</text>

  <g>
    <text class="prompt l1" x="36" y="86">➜ ~ whoami</text>
    <text class="accent l2" x="36" y="122">Nilesh Singh</text>
    <text class="out l3" x="36" y="152">data analyst × ai evaluation — pune, india</text>
    <text class="prompt l4" x="36" y="192">➜ ~ cat focus.txt</text>
    <text class="out l5" x="36" y="222">data quality · llm evals · dashboards that decide</text>
    <text class="dim l6" x="36" y="260">open to: data analyst · ai trainer · evaluation roles</text>
    <rect class="cursor" x="36" y="266" width="11" height="20"/>
  </g>
</svg>
