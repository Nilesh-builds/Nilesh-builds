  <text x="24" y="144" font-size="12.5" fill="#E8F5E1" fill-opacity=".86">Onboarding, leave management, sentiment analysis,</text><text x="24" y="163" font-size="12.5" fill="#E8F5E1" fill-opacity=".86">policy Q&amp;A, an AI resume screener and a WhatsApp</text><text x="24" y="182" font-size="12.5" fill="#E8F5E1" fill-opacity=".86">HR chatbot. Sheets as the store, GPT-4 as the</text><text x="24" y="201" font-size="12.5" fill="#E8F5E1" fill-opacity=".86">brain.</text>
