</g>
<rect x="1.5" y="1.5" width="997.0" height="247.0" rx="24" pathLength="100" fill="none" stroke="#22331E" stroke-width="1.5"/><rect class="beam" x="1.5" y="1.5" width="997.0" height="247.0" rx="24" pathLength="100" fill="none" stroke="#CAFF3C" stroke-width="5" opacity=".45" filter="url(#bl4)" style="animation-duration:9s;animation-delay:0s"/><rect class="beam" x="1.5" y="1.5" width="997.0" height="247.0" rx="24" pathLength="100" fill="none" stroke="#CAFF3C" stroke-width="2" stroke-linecap="round" style="animation-duration:9s;animation-delay:0s"/>

