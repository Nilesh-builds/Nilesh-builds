<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
<title id="t">Let's talk data — open to roles</title><desc id="d">Animated radar. Open to Data Analyst, Business Analyst, AI Trainer and AI Evaluation roles.</desc>
<defs><filter id="bl4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="bl60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="bl2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter><clipPath id="rc"><rect width="1000" height="250" rx="24"/></clipPath>
<radialGradient id="sw" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(790 125) scale(125)"><stop offset="0" stop-color="#CAFF3C" stop-opacity=".0"/><stop offset="1" stop-color="#CAFF3C" stop-opacity=".55"/></radialGradient>
<pattern id="dg" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#CAFF3C" opacity=".13"/></pattern>
<linearGradient id="hl" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="520" y2="0"><stop offset="0" stop-color="#CAFF3C"/><stop offset=".6" stop-color="#4DFFB4"/><stop offset="1" stop-color="#3CE8FF"/></linearGradient></defs>
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.pre{white-space:pre}
.rv{opacity:0}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.rv{opacity:1!important}
.alt{display:none}
}
.beam{stroke-dasharray:12 88;animation:beam 7s linear infinite}@keyframes beam{to{stroke-dashoffset:-100}}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 4.8s ease-out infinite}
@keyframes rip{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}
.sw{transform-box:view-box;transform-origin:790px 125px;animation:rot 6s linear infinite} @keyframes rot{to{transform:rotate(360deg)}}
.bl{opacity:0;animation:bl 6s linear infinite} @keyframes bl{0%{opacity:1}60%,100%{opacity:0}}
.cen{transform-box:fill-box;transform-origin:center;animation:cen 2.6s ease-in-out infinite} @keyframes cen{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl 5s ease-in-out infinite} @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.blink{animation:blink 1.1s steps(1) infinite} @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes tw0{0%,4.167%{clip-path:inset(0 100% 0 0);animation-timing-function:steps(69,end)}32.917%,96.667%{clip-path:inset(0 0 0 0)}96.677%,100%{clip-path:inset(0 100% 0 0)}}@keyframes tc0{0%{opacity:0}4.157%{opacity:0}4.167%{opacity:1;transform:translateX(0);animation-timing-function:steps(69,end)}32.917%,96.667%{opacity:1;transform:translateX(579.6px)}96.677%,100%{opacity:0;transform:translateX(579.6px)}}.tw0{animation:tw0 12.0s linear infinite}.tc0{opacity:0;animation:tc0 12.0s linear infinite}
</style>

<g clip-path="url(#rc)">
  <rect width="1000" height="250" fill="#050A07"/>
  <rect width="1000" height="250" fill="url(#dg)"/>
  <ellipse cx="790" cy="125" rx="260" ry="170" fill="#CAFF3C" opacity=".12" filter="url(#bl60)"/>
  <ellipse cx="120" cy="230" rx="260" ry="100" fill="#3CE8FF" opacity=".07" filter="url(#bl60)"/>
  <line x1="665" y1="125" x2="915" y2="125" stroke="#CAFF3C" stroke-opacity=".16"/><line x1="790" y1="0" x2="790" y2="250" stroke="#CAFF3C" stroke-opacity=".16"/>
  <circle cx="790" cy="125" r="40" fill="none" stroke="#CAFF3C" stroke-opacity=".16"/><circle cx="790" cy="125" r="80" fill="none" stroke="#CAFF3C" stroke-opacity=".16"/><circle cx="790" cy="125" r="120" fill="none" stroke="#CAFF3C" stroke-opacity=".16"/><circle class="rip" cx="790" cy="125" r="120" fill="none" stroke="#CAFF3C" stroke-width="1.6" style="animation-delay:0.0s"/><circle class="rip" cx="790" cy="125" r="120" fill="none" stroke="#CAFF3C" stroke-width="1.6" style="animation-delay:1.2s"/><circle class="rip" cx="790" cy="125" r="120" fill="none" stroke="#CAFF3C" stroke-width="1.6" style="animation-delay:2.4s"/><circle class="rip" cx="790" cy="125" r="120" fill="none" stroke="#CAFF3C" stroke-width="1.6" style="animation-delay:3.5999999999999996s"/>
  <g class="sw"><path d="M790 125L910 125A120 120 0 0 0 832.6 12.8Z" fill="url(#sw)"/><line x1="790" y1="125" x2="910" y2="125" stroke="#CAFF3C" stroke-width="2"/></g>
  <circle class="bl" cx="738" cy="95" r="4" fill="#4DFFB4" style="animation-delay:3.50s"/><circle class="bl" cx="834" cy="163" r="4" fill="#4DFFB4" style="animation-delay:0.68s"/><circle class="bl" cx="860" cy="75" r="4" fill="#4DFFB4" style="animation-delay:5.41s"/><circle class="bl" cx="770" cy="187" r="4" fill="#4DFFB4" style="animation-delay:1.80s"/><circle class="bl" cx="812" cy="55" r="4" fill="#4DFFB4" style="animation-delay:4.79s"/>
  <circle class="cen" cx="790" cy="125" r="9" fill="#CAFF3C"/>
  <circle cx="790" cy="125" r="16" fill="none" stroke="#CAFF3C" stroke-opacity=".6"/>

  <text x="48" y="64" font-size="13" letter-spacing="2.4" fill="#7A8B6F">// SIGNAL DETECTED</text>
  <text x="46" y="122" font-size="52" font-weight="800" letter-spacing="-1" fill="url(#hl)">LET'S TALK DATA.</text>
  <text class="tw0 pre" x="48" y="168" font-size="14" fill="#E8F5E1" textLength="579.6" lengthAdjust="spacing">open to: data analyst · business analyst · ai trainer · ai evaluation</text><rect class="tc0" x="48" y="156.8" width="7.6" height="14.7" fill="#CAFF3C"/>
  <text x="48" y="206" font-size="13" fill="#7A8B6F">replies land in my inbox — evidence-based answers guaranteed*</text>
